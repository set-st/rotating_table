; PlatformIO Project Configuration File
;
; Two separate firmwares for ESP32:
; 1. env:rotating_table - Firmware for Rotating Table (Master with WiFi, Web UI, and BLE Client)
; 2. env:tilt_platform  - Firmware for Tilt Platform (Slave with Opto Stepper, Endstop, GY-521, and BLE Server)
; 3. env:railway        - Firmware for RailWay carriage on MKS DLC32 (X/Z axes, WiFi, Web UI; no BLE)
;

[platformio]
default_envs = rotating_table, tilt_platform, railway

[env]
extra_scripts = pre:scripts/inject_version.py

[env:rotating_table]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
	waspinator/AccelStepper @ ^1.64
	bblanchon/ArduinoJson @ ^7.0.4
	h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D TARGET_ROTATING_TABLE
build_src_filter =
	+<*>
	-<main_tilt.cpp>
	-<main_railway.cpp>
	-<tilt_*>
	-<railway_*>

[env:tilt_platform]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
	waspinator/AccelStepper @ ^1.64
	bblanchon/ArduinoJson @ ^7.0.4
	h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D TARGET_TILT_PLATFORM
build_src_filter =
	+<tilt_*.cpp>
	+<main_tilt.cpp>
	-<main.cpp>
	-<motion_controller.*>
	-<wifi_manager.*>
	-<web_server.*>
	-<ota_updater.*>
	-<imu_sensor.*>
	-<table_ble_client.*>

[env:railway]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
	bblanchon/ArduinoJson @ ^7.0.4
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D TARGET_RAILWAY
	-D HOSTNAME=\"railway\"
	-D AP_SSID=\"RailWay-ESP32\"
build_src_filter =
	-<*>
	+<main_railway.cpp>
	+<railway_*.cpp>
	+<wifi_manager.cpp>
	+<ota_updater.cpp>
