name: Build Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and publish as a release (optional)'
        required: false
        type: string
  pull_request:
    branches: [ main ]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*)
              ;;
            *)
              echo "::error::release_tag must start with v and contain a version, for example v1.0.1"
              exit 1
              ;;
          esac
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Git tag '$RELEASE_TAG' does not exist on origin. Create and push it first."
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"

      - name: Set firmware version
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            BUILD_VERSION="$RELEASE_TAG_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_VERSION="$GITHUB_REF_NAME"
          else
            BUILD_VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          echo "FIRMWARE_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Run PlatformIO Build
        run: pio run

      - name: Prepare named firmware binaries
        run: |
          mkdir -p dist
          cp .pio/build/rotating_table/firmware.bin dist/rotating_table.bin
          cp .pio/build/tilt_platform/firmware.bin dist/tilt_platform.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: dist/*.bin
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG="${RELEASE_TAG_INPUT:-$GITHUB_REF_NAME}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/rotating_table.bin dist/tilt_platform.bin --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/rotating_table.bin dist/tilt_platform.bin \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
